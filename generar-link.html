<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Used Vintage — Generador de links</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #1a0a2e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .bg-orb {
      position: fixed; border-radius: 50%;
      filter: blur(80px); opacity: 0.2; pointer-events: none;
    }
    .bg-orb-1 { width: 300px; height: 300px; background: #e8608a; top: -80px; left: -80px; }
    .bg-orb-2 { width: 280px; height: 280px; background: #f0c060; bottom: -60px; right: -60px; }

    .card {
      position: relative; z-index: 10;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      border: 1px solid rgba(240,192,96,0.2);
      padding: 2.2rem;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    }
    .marca { font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: #f0c060; margin-bottom: 0.5rem; opacity: 0.8; }
    h1 { font-family: 'Playfair Display', serif; font-size: 22px; color: #fdf0e0; margin-bottom: 0.3rem; }
    .sub { font-size: 13px; color: rgba(253,240,224,0.4); margin-bottom: 2rem; }
    label { font-size: 13px; color: rgba(253,240,224,0.6); display: block; margin-bottom: 8px; font-weight: 500; }
    input {
      width: 100%; padding: 13px 16px;
      border: 1px solid rgba(240,192,96,0.25);
      border-radius: 12px; font-size: 15px;
      margin-bottom: 1.2rem; font-family: inherit;
      background: rgba(255,255,255,0.06);
      color: #fdf0e0; transition: border-color 0.2s;
    }
    input::placeholder { color: rgba(253,240,224,0.25); }
    input:focus { outline: none; border-color: rgba(240,192,96,0.6); background: rgba(255,255,255,0.09); }
    .btn-generar {
      width: 100%;
      background: linear-gradient(135deg, #e8a030, #f0c060, #e8a030);
      background-size: 200%;
      color: #1a0a2e; border: none; border-radius: 50px;
      padding: 15px; font-size: 15px; font-weight: 500;
      cursor: pointer; font-family: inherit;
      transition: opacity 0.2s, transform 0.1s;
      animation: shimmer 3s ease infinite;
    }
    .btn-generar:hover { opacity: 0.9; transform: translateY(-1px); }
    @keyframes shimmer {
      0%,100% { background-position: 0%; }
      50% { background-position: 100%; }
    }
    .resultado { display: none; margin-top: 1.5rem; padding: 1.2rem; background: rgba(255,255,255,0.04); border-radius: 14px; border: 1px solid rgba(240,192,96,0.15); }
    .resultado-label { font-size: 12px; color: rgba(253,240,224,0.4); margin-bottom: 10px; }
    .link-text {
      font-size: 12px; word-break: break-all;
      color: #f0c060; font-family: monospace;
      background: rgba(0,0,0,0.25);
      padding: 10px 12px; border-radius: 8px;
      border: 1px solid rgba(240,192,96,0.15);
      margin-bottom: 12px; line-height: 1.6;
    }
    .btns-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-copiar, .btn-wsp {
      padding: 10px 18px; font-size: 13px;
      border-radius: 8px; cursor: pointer;
      font-family: inherit; border: none;
      font-weight: 500; transition: opacity 0.2s;
    }
    .btn-copiar { background: rgba(255,255,255,0.12); color: #fdf0e0; border: 1px solid rgba(255,255,255,0.15); }
    .btn-wsp { background: #25D366; color: #fff; }
    .btn-copiar:hover, .btn-wsp:hover { opacity: 0.85; }
    .copiado { color: #60d480; font-size: 12px; margin-top: 8px; display: none; }
  </style>
</head>
<body>
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>

  <div class="card">
    <p class="marca">Used Vintage</p>
    <h1>Generador de regalos</h1>
    <p class="sub">Ingresá el nombre de la clienta y generá su link único.</p>

    <label for="nombre">Nombre de la clienta</label>
    <input type="text" id="nombre" placeholder="ej: Sofi, Ana, Caro..."
      autocomplete="off" onkeydown="if(event.key==='Enter') generarLink()" />

    <button class="btn-generar" onclick="generarLink()">✨ Generar link de regalo</button>

    <div class="resultado" id="resultado">
      <p class="resultado-label">Link generado — válido por 3 días:</p>
      <div class="link-text" id="linkTexto"></div>
      <div class="btns-row">
        <button class="btn-copiar" onclick="copiar()">Copiar</button>
        <button class="btn-wsp" onclick="abrirWsp()">Enviar por WhatsApp</button>
      </div>
      <p class="copiado" id="copiado">¡Copiado!</p>
    </div>
  </div>

<script>
  const DOMINIO = "https://used-vintage-cupones.pages.dev";
  let linkActual = "";

  function generarLink() {
    const nombre = document.getElementById('nombre').value.trim();
    if (!nombre) { alert('Ingresá un nombre'); return; }
    const hoy = new Date();
    const fecha = hoy.getFullYear() + String(hoy.getMonth()+1).padStart(2,'0') + String(hoy.getDate()).padStart(2,'0');
    const random = Math.random().toString(36).slice(2,6);
    const slug = nombre.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,'');
    const codigo = `${slug}_${fecha}_${random}`;
    linkActual = `${DOMINIO}/?c=${codigo}`;
    document.getElementById('linkTexto').textContent = linkActual;
    document.getElementById('resultado').style.display = 'block';
    document.getElementById('copiado').style.display = 'none';
    document.getElementById('nombre').value = '';
  }

  function copiar() {
    navigator.clipboard.writeText(linkActual).then(() => {
      const el = document.getElementById('copiado');
      el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 2000);
    });
  }

  function abrirWsp() {
    const texto = encodeURIComponent("¡Hola! 🎁 Used Vintage te tiene un regalo especial.\nTocá el link para descubrirlo: " + linkActual);
    window.open(`https://wa.me/?text=${texto}`, '_blank');
  }
</script>
</body>
</html>
