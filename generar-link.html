<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Used Vintage — Generador de links</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background: #fdf6ee;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      border: 1px solid #e0d4c8;
      padding: 2rem;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    }
    .marca { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #999; margin-bottom: 0.4rem; }
    h1 { font-size: 20px; font-weight: 500; color: #1a1a1a; margin-bottom: 0.3rem; }
    .sub { font-size: 13px; color: #aaa; margin-bottom: 1.8rem; }
    label { font-size: 13px; color: #555; display: block; margin-bottom: 6px; font-weight: 500; }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e0d4c8;
      border-radius: 10px;
      font-size: 15px;
      margin-bottom: 1.2rem;
      font-family: inherit;
      background: #fafafa;
      transition: border-color 0.2s;
    }
    input:focus { outline: none; border-color: #c9773a; background: #fff; }
    .btn-generar {
      width: 100%;
      background: #c9773a;
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 14px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.2s;
    }
    .btn-generar:hover { opacity: 0.88; }
    .resultado {
      display: none;
      margin-top: 1.5rem;
      padding: 1rem 1.2rem;
      background: #f5f0eb;
      border-radius: 12px;
    }
    .resultado-label { font-size: 12px; color: #999; margin-bottom: 8px; }
    .link-text {
      font-size: 13px;
      word-break: break-all;
      color: #1a1a1a;
      font-family: monospace;
      background: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #e0d4c8;
      margin-bottom: 10px;
      line-height: 1.5;
    }
    .btns-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-copiar, .btn-wsp {
      padding: 9px 18px;
      font-size: 13px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      border: none;
      font-weight: 500;
      transition: opacity 0.2s;
    }
    .btn-copiar { background: #1a1a1a; color: #fff; }
    .btn-wsp { background: #25D366; color: #fff; }
    .btn-copiar:hover, .btn-wsp:hover { opacity: 0.85; }
    .copiado { color: #4caf50; font-size: 12px; margin-top: 8px; display: none; }
  </style>
</head>
<body>
<div class="card">
  <p class="marca">Used Vintage</p>
  <h1>Generador de links de regalo</h1>
  <p class="sub">Ingresá el nombre de la clienta y generá su link único de 3 días.</p>

  <label for="nombre">Nombre de la clienta</label>
  <input type="text" id="nombre" placeholder="ej: Sofi, Ana, Caro..." autocomplete="off"
    onkeydown="if(event.key==='Enter') generarLink()" />

  <button class="btn-generar" onclick="generarLink()">Generar link</button>

  <div class="resultado" id="resultado">
    <p class="resultado-label">Link generado — válido por 3 días:</p>
    <div class="link-text" id="linkTexto"></div>
    <div class="btns-row">
      <button class="btn-copiar" onclick="copiar()">Copiar link</button>
      <button class="btn-wsp" onclick="abrirWsp()">Enviar por WhatsApp</button>
    </div>
    <p class="copiado" id="copiado">¡Copiado!</p>
  </div>
</div>

<script>
  // ← Cambiá esto cuando tengas el dominio de Netlify
  const DOMINIO = "https://usedvintage-regalo.netlify.app";

  let linkActual = "";

  function generarLink() {
    const nombre = document.getElementById('nombre').value.trim();
    if (!nombre) { alert('Ingresá un nombre'); return; }

    const hoy = new Date();
    const fecha = hoy.getFullYear().toString() +
      String(hoy.getMonth() + 1).padStart(2, '0') +
      String(hoy.getDate()).padStart(2, '0');

    const random = Math.random().toString(36).slice(2, 6);
    const slug = nombre.toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]/g, '');
    const codigo = `${slug}_${fecha}_${random}`;

    linkActual = `${DOMINIO}/?c=${codigo}`;
    document.getElementById('linkTexto').textContent = linkActual;
    document.getElementById('resultado').style.display = 'block';
    document.getElementById('copiado').style.display = 'none';
    document.getElementById('nombre').value = '';
  }

  function copiar() {
    navigator.clipboard.writeText(linkActual).then(() => {
      const el = document.getElementById('copiado');
      el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 2000);
    });
  }

  function abrirWsp() {
    const texto = encodeURIComponent(
      "¡Hola! 🎁 Used Vintage te tiene un regalo especial.\nTocá el link para descubrirlo: " + linkActual
    );
    window.open(`https://wa.me/?text=${texto}`, '_blank');
  }
</script>
</body>
</html>
