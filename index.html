<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Used Vintage — Tu regalo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #fdf6ee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .marca {
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: 24px;
      font-weight: 500;
      color: #1a1a1a;
      text-align: center;
      margin-bottom: 2rem;
      line-height: 1.3;
    }

    /* ── Ventana de animación ── */
    .ventana-wrap {
      width: 320px;
      height: 180px;
      border-radius: 16px;
      border: 1.5px solid #e0d4c8;
      background: #fff;
      overflow: hidden;
      position: relative;
      margin-bottom: 2rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    .cupones-track {
      display: flex;
      flex-direction: column;
      will-change: transform;
    }

    .cupon-slide {
      width: 320px;
      height: 180px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .cupon-slide img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }

    .linea-superior, .linea-inferior {
      position: absolute;
      left: 0; right: 0;
      height: 2px;
      background: #c9773a;
      pointer-events: none;
    }
    .linea-superior { top: 0; }
    .linea-inferior { bottom: 0; }

    /* ── Botón ── */
    .btn-tocar {
      background: #c9773a;
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 16px 48px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      letter-spacing: 0.02em;
    }
    .btn-tocar:hover { opacity: 0.88; }
    .btn-tocar:active { transform: scale(0.97); }
    .btn-tocar:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

    /* ── Estado: ya ganó ── */
    #pantalla-ganadora {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      text-align: center;
    }

    .ganadora-titulo {
      font-size: 22px;
      font-weight: 500;
      color: #1a1a1a;
    }

    .cupon-ganado-wrap {
      width: 320px;
      border-radius: 16px;
      overflow: hidden;
      border: 1.5px solid #e0d4c8;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
    }

    .cupon-ganado-wrap img {
      width: 100%;
      display: block;
    }

    .instruccion {
      font-size: 13px;
      color: #999;
      max-width: 280px;
      line-height: 1.6;
    }

    /* ── Estado: expirado ── */
    #pantalla-expirado {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      text-align: center;
    }

    .exp-icono { font-size: 40px; }
    .exp-titulo { font-size: 20px; font-weight: 500; color: #1a1a1a; }
    .exp-sub { font-size: 14px; color: #999; max-width: 260px; line-height: 1.6; }

    /* ── Estado: error ── */
    #pantalla-error {
      display: none;
      text-align: center;
      color: #999;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- PANTALLA PRINCIPAL: animación -->
  <div id="pantalla-principal">
    <p class="marca">Used Vintage</p>
    <h1 id="titulo-principal">te regala un...</h1>

    <div class="ventana-wrap">
      <div class="cupones-track" id="track"></div>
      <div class="linea-superior"></div>
      <div class="linea-inferior"></div>
    </div>

    <button class="btn-tocar" id="btnTocar">Tocá para recibir tu regalo</button>
  </div>

  <!-- PANTALLA GANADORA: cupón ya asignado -->
  <div id="pantalla-ganadora">
    <p class="marca">Used Vintage</p>
    <p class="ganadora-titulo">¡Este es tu cupón!</p>
    <div class="cupon-ganado-wrap">
      <img id="img-ganadora" src="" alt="Tu cupón" />
    </div>
    <p class="instruccion">Guardá esta imagen o mostrá este link cuando hagas tu compra.</p>
  </div>

  <!-- PANTALLA EXPIRADO -->
  <div id="pantalla-expirado">
    <p class="exp-icono">⏳</p>
    <p class="exp-titulo">Este link expiró</p>
    <p class="exp-sub">Los links de regalo duran 3 días. Pedile a Used Vintage un nuevo link.</p>
  </div>

  <!-- PANTALLA ERROR -->
  <div id="pantalla-error">
    <p>Link inválido. Revisá que el link esté completo.</p>
  </div>

  <script type="module">
    import { CUPONES, DIAS_EXPIRACION } from './src/cupones.js';
    import { getRegalo, guardarRegalo } from './src/supabase.js';

    const ITEM_H = 180;

    // ── Leer código del link ──
    const params = new URLSearchParams(window.location.search);
    const codigo = params.get('c');

    if (!codigo) {
      mostrarPantalla('error');
    } else {
      iniciar(codigo);
    }

    async function iniciar(codigo) {
      const registro = await getRegalo(codigo);

      if (registro === 'error') {
        mostrarPantalla('error');
        return;
      }

      if (registro) {
        // Ya jugó antes
        const fechaCreacion = new Date(registro.creado_en);
        const ahora = new Date();
        const diasPasados = (ahora - fechaCreacion) / (1000 * 60 * 60 * 24);

        if (diasPasados > DIAS_EXPIRACION) {
          mostrarPantalla('expirado');
        } else {
          mostrarCuponGanado(registro.cupon_id);
        }
        return;
      }

      // Primera vez — verificar expiración del link en sí
      // (el link tiene fecha codificada: código_YYYYMMDD)
      const partes = codigo.split('_');
      if (partes.length >= 2) {
        const fechaStr = partes[partes.length - 1];
        const anio = parseInt(fechaStr.slice(0, 4));
        const mes = parseInt(fechaStr.slice(4, 6)) - 1;
        const dia = parseInt(fechaStr.slice(6, 8));
        const fechaLink = new Date(anio, mes, dia);
        const ahora = new Date();
        const diasPasados = (ahora - fechaLink) / (1000 * 60 * 60 * 24);
        if (diasPasados > DIAS_EXPIRACION) {
          mostrarPantalla('expirado');
          return;
        }
      }

      // Armar la animación
      armarTrack();
    }

    function armarTrack() {
      const track = document.getElementById('track');
      const REPETICIONES = 8;
      const lista = [];
      for (let i = 0; i < REPETICIONES; i++) lista.push(...CUPONES);

      lista.forEach(c => {
        const div = document.createElement('div');
        div.className = 'cupon-slide';
        const img = document.createElement('img');
        img.src = c.imagen;
        img.alt = c.label;
        div.appendChild(img);
        track.appendChild(div);
      });

      document.getElementById('btnTocar').addEventListener('click', () => jugar(track, lista));
    }

    function elegirCupon() {
      const total = CUPONES.reduce((s, c) => s + c.probabilidad, 0);
      let r = Math.random() * total;
      for (let c of CUPONES) { r -= c.probabilidad; if (r <= 0) return c; }
      return CUPONES[0];
    }

    async function jugar(track, lista) {
      const btn = document.getElementById('btnTocar');
      btn.disabled = true;

      const ganador = elegirCupon();
      const totalItems = lista.length;
      const idxBase = Math.floor(totalItems * 0.7);
      const idxGanador = idxBase - (idxBase % CUPONES.length) + CUPONES.findIndex(c => c.id === ganador.id);
      const distancia = idxGanador * ITEM_H;

      const duracion = 3400;
      const inicio = performance.now();

      function easeOut(t) { return 1 - Math.pow(1 - t, 4); }

      function animar(ahora) {
        const elapsed = ahora - inicio;
        const t = Math.min(elapsed / duracion, 1);
        const pos = easeOut(t) * distancia;
        track.style.transform = `translateY(-${pos}px)`;
        if (t < 1) {
          requestAnimationFrame(animar);
        } else {
          guardarYMostrar(ganador);
        }
      }
      requestAnimationFrame(animar);
    }

    async function guardarYMostrar(ganador) {
      const codigo = new URLSearchParams(window.location.search).get('c');
      await guardarRegalo(codigo, ganador.id);
      setTimeout(() => mostrarCuponGanado(ganador.id), 500);
    }

    function mostrarCuponGanado(cuponId) {
      const cupon = CUPONES.find(c => c.id === cuponId) || CUPONES[0];
      document.getElementById('img-ganadora').src = cupon.imagen;
      mostrarPantalla('ganadora');
    }

    function mostrarPantalla(cual) {
      document.getElementById('pantalla-principal').style.display = cual === 'principal' ? 'block' : 'none';
      document.getElementById('pantalla-ganadora').style.display = cual === 'ganadora' ? 'flex' : 'none';
      document.getElementById('pantalla-expirado').style.display = cual === 'expirado' ? 'flex' : 'none';
      document.getElementById('pantalla-error').style.display = cual === 'error' ? 'block' : 'none';
    }
  </script>

</body>
</html>
