<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Used Vintage — Tu regalo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background: #fdf6ee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .marca {
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 0.5rem;
      text-align: center;
    }

    h1 {
      font-size: 24px;
      font-weight: 400;
      color: #1a1a1a;
      text-align: center;
      margin-bottom: 2rem;
    }

    /* Ventana animación */
    .ventana-wrap {
      width: 320px;
      height: 180px;
      border-radius: 16px;
      border: 1.5px solid #e0d4c8;
      background: #fff;
      overflow: hidden;
      position: relative;
      margin-bottom: 2rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .cupones-track {
      display: flex;
      flex-direction: column;
      will-change: transform;
    }
    .cupon-slide {
      width: 320px;
      height: 180px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }
    .cupon-slide img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }
    .linea-sup, .linea-inf {
      position: absolute;
      left: 0; right: 0;
      height: 2px;
      background: #c9773a;
      pointer-events: none;
    }
    .linea-sup { top: 0; }
    .linea-inf { bottom: 0; }

    /* Botón */
    .btn-tocar {
      background: #c9773a;
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 16px 48px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      font-family: inherit;
    }
    .btn-tocar:hover { opacity: 0.88; }
    .btn-tocar:active { transform: scale(0.97); }
    .btn-tocar:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

    /* Pantalla ganadora */
    #p-ganadora {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      text-align: center;
    }
    .ganadora-titulo { font-size: 22px; font-weight: 500; color: #1a1a1a; }
    .cupon-ganado-wrap {
      width: 320px;
      border-radius: 16px;
      overflow: hidden;
      border: 1.5px solid #e0d4c8;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
    }
    .cupon-ganado-wrap img { width: 100%; display: block; }
    .instruccion { font-size: 13px; color: #999; max-width: 280px; line-height: 1.6; }

    /* Pantalla expirado */
    #p-expirado {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      text-align: center;
    }
    .exp-icono { font-size: 40px; }
    .exp-titulo { font-size: 20px; font-weight: 500; color: #1a1a1a; }
    .exp-sub { font-size: 14px; color: #999; max-width: 260px; line-height: 1.6; }

    /* Pantalla error */
    #p-error {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      text-align: center;
    }
    #p-error p { font-size: 14px; color: #aaa; }

    /* Cargando */
    #p-cargando { text-align: center; color: #bbb; font-size: 14px; }
  </style>
</head>
<body>

  <div id="p-cargando">
    <p class="marca">Used Vintage</p>
    <br><p>Cargando...</p>
  </div>

  <div id="p-principal" style="display:none; flex-direction:column; align-items:center;">
    <p class="marca">Used Vintage</p>
    <h1>te regala un...</h1>
    <div class="ventana-wrap">
      <div class="cupones-track" id="track"></div>
      <div class="linea-sup"></div>
      <div class="linea-inf"></div>
    </div>
    <button class="btn-tocar" id="btnTocar">Tocá para recibir tu regalo</button>
  </div>

  <div id="p-ganadora">
    <p class="marca">Used Vintage</p>
    <p class="ganadora-titulo">¡Este es tu cupón!</p>
    <div class="cupon-ganado-wrap">
      <img id="img-ganadora" src="" alt="Tu cupón" />
    </div>
    <p class="instruccion">Guardá esta imagen o mostrá este link al hacer tu compra.</p>
  </div>

  <div id="p-expirado">
    <p class="exp-icono">⏳</p>
    <p class="exp-titulo">Este link expiró</p>
    <p class="exp-sub">Los links de regalo duran 3 días. Pedile a Used Vintage un nuevo link.</p>
  </div>

  <div id="p-error">
    <p class="marca">Used Vintage</p>
    <br><p>Link inválido o expirado.</p>
  </div>

<script>
// ============================================================
//  CUPONES — agregá o cambiá acá
//  probabilidad: número más alto = sale más seguido
// ============================================================
const CUPONES = [
  {
    id: "cupon10",
    imagen: "Cupon10.png",
    label: "10% de descuento",
    probabilidad: 70,
  },
  {
    id: "cupon15",
    imagen: "Cupon15.png",
    label: "15% de descuento",
    probabilidad: 30,
  },
  // Para agregar más cupones, copiá este bloque y pegalo acá arriba:
  // {
  //   id: "cuponNuevo",           ← nombre interno único, sin espacios
  //   imagen: "NombreArchivo.png", ← nombre exacto del archivo
  //   label: "Descripción corta",
  //   probabilidad: 20,
  // },
];

const DIAS_EXPIRACION = 3;

// ============================================================
//  SUPABASE — ya configurado con tu proyecto
// ============================================================
const SUPABASE_URL = "https://akfxqtzbkrrroaejdxbg.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFrZnhxdHpia3Jycm9hZWpkeGJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyNjQxODMsImV4cCI6MjA5Mzg0MDE4M30.qWVrTuqjK2Q9ah7uad1Mgiz4zWSS-iuZ9xob53zsNb4"; // ← reemplazá esto con la clave "anon public" que empieza con eyJ...

// ============================================================
//  LÓGICA — no toques nada de acá abajo
// ============================================================
const ITEM_H = 180;
const PANTALLAS = ['p-cargando','p-principal','p-ganadora','p-expirado','p-error'];

function mostrar(id) {
  PANTALLAS.forEach(p => {
    const el = document.getElementById(p);
    if (!el) return;
    if (p === id) {
      el.style.display = (p === 'p-principal' || p === 'p-ganadora' || p === 'p-expirado' || p === 'p-error') ? 'flex' : 'block';
    } else {
      el.style.display = 'none';
    }
  });
}

async function dbGet(codigo) {
  try {
    const r = await fetch(
      `${SUPABASE_URL}/rest/v1/regalos?codigo=eq.${encodeURIComponent(codigo)}&select=*`,
      { headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` } }
    );
    if (!r.ok) return 'error';
    const d = await r.json();
    return d.length > 0 ? d[0] : null;
  } catch(e) { return 'error'; }
}

async function dbGuardar(codigo, cuponId) {
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/regalos`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`,
        "Prefer": "return=minimal"
      },
      body: JSON.stringify({ codigo, cupon_id: cuponId, creado_en: new Date().toISOString() })
    });
    return r.ok;
  } catch(e) { return false; }
}

function elegirCupon() {
  const total = CUPONES.reduce((s, c) => s + c.probabilidad, 0);
  let r = Math.random() * total;
  for (const c of CUPONES) { r -= c.probabilidad; if (r <= 0) return c; }
  return CUPONES[0];
}

function diasDesde(fechaStr) {
  return (Date.now() - new Date(fechaStr).getTime()) / (1000 * 60 * 60 * 24);
}

function armarTrack() {
  const track = document.getElementById('track');
  const lista = [];
  for (let i = 0; i < 8; i++) lista.push(...CUPONES);
  lista.forEach(c => {
    const div = document.createElement('div');
    div.className = 'cupon-slide';
    div.innerHTML = `<img src="${c.imagen}" alt="${c.label}" />`;
    track.appendChild(div);
  });
  return lista;
}

function animar(lista, ganador, onFin) {
  const track = document.getElementById('track');
  const idxBase = Math.floor(lista.length * 0.7);
  const idxGanador = idxBase - (idxBase % CUPONES.length) + CUPONES.findIndex(c => c.id === ganador.id);
  const distancia = idxGanador * ITEM_H;
  const duracion = 3400;
  const inicio = performance.now();
  const ease = t => 1 - Math.pow(1 - t, 4);
  function frame(now) {
    const t = Math.min((now - inicio) / duracion, 1);
    track.style.transform = `translateY(-${ease(t) * distancia}px)`;
    if (t < 1) requestAnimationFrame(frame);
    else setTimeout(onFin, 500);
  }
  requestAnimationFrame(frame);
}

function mostrarGanadora(cuponId) {
  const cupon = CUPONES.find(c => c.id === cuponId) || CUPONES[0];
  document.getElementById('img-ganadora').src = cupon.imagen;
  mostrar('p-ganadora');
}

async function iniciar() {
  const params = new URLSearchParams(window.location.search);
  const codigo = params.get('c');

  if (!codigo) { mostrar('p-error'); return; }

  // Verificar expiración por fecha en el código (formato: nombre_YYYYMMDD_xxxx)
  const partes = codigo.split('_');
  if (partes.length >= 3) {
    const f = partes[partes.length - 2];
    if (f && f.length === 8 && /^\d{8}$/.test(f)) {
      const fecha = new Date(
        parseInt(f.slice(0,4)),
        parseInt(f.slice(4,6)) - 1,
        parseInt(f.slice(6,8))
      );
      if (diasDesde(fecha) > DIAS_EXPIRACION) { mostrar('p-expirado'); return; }
    }
  }

  const registro = await dbGet(codigo);
  if (registro === 'error') { mostrar('p-error'); return; }

  if (registro) {
    if (diasDesde(registro.creado_en) > DIAS_EXPIRACION) { mostrar('p-expirado'); return; }
    mostrarGanadora(registro.cupon_id);
    return;
  }

  // Primera vez
  mostrar('p-principal');
  const lista = armarTrack();

  document.getElementById('btnTocar').addEventListener('click', () => {
    document.getElementById('btnTocar').disabled = true;
    const ganador = elegirCupon();
    animar(lista, ganador, async () => {
      await dbGuardar(codigo, ganador.id);
      mostrarGanadora(ganador.id);
    });
  });
}

iniciar();
</script>
</body>
</html>
